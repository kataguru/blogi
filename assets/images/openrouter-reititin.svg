<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">OpenRouter-reititin ohjaa saman Luna-mallin kahdelle providerille</title>
  <desc id="desc">Kaavio, jossa OpenRouter-reititin ohjaa openai/gpt-5.6-luna-20260709 -mallipyynnön halvalle OpenAI-reitille tai kalliimmalle Azure-reitille.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="url(#bg)"/>
  <text x="80" y="98" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">KATAGURU</text>
  <text x="80" y="128" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="18">Havaintokuva: sama Luna-malli, kaksi eri reittiä</text>

  <rect x="430" y="120" width="340" height="72" rx="16" fill="#111827" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="165" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">openai/gpt-5.6-luna</text>
  <text x="600" y="205" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">sama mallipyyntö</text>

  <rect x="455" y="265" width="290" height="185" rx="24" fill="#0f172a" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="485" y="285" width="230" height="88" rx="18" fill="#020617" stroke="#334155" stroke-width="2"/>
  <circle cx="515" cy="417" r="7" fill="#22c55e"/>
  <circle cx="555" cy="417" r="7" fill="#22c55e"/>
  <circle cx="595" cy="417" r="7" fill="#22c55e"/>
  <circle cx="635" cy="417" r="7" fill="#22c55e"/>
  <circle cx="675" cy="417" r="7" fill="#22c55e"/>
  <text x="600" y="338" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">OpenRouter</text>
  <text x="600" y="470" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">REITITIN</text>
  <text x="600" y="505" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">valitsee providerin hinnan, saatavuuden</text>
  <text x="600" y="533" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">ominaisuuksien ja välimuistin perusteella</text>

  <rect x="80" y="235" width="270" height="190" rx="24" fill="#052e16" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
  <text x="215" y="285" text-anchor="middle" fill="#86efac" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Halpa reitti</text>
  <text x="215" y="325" text-anchor="middle" fill="#f0fdf4" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">OpenAI</text>
  <text x="215" y="368" text-anchor="middle" fill="#dcfce7" font-family="Arial, Helvetica, sans-serif" font-size="28">0,10 $ / Mtok input</text>
  <text x="215" y="405" text-anchor="middle" fill="#dcfce7" font-family="Arial, Helvetica, sans-serif" font-size="28">0,60 $ / Mtok output</text>
  <circle cx="305" cy="275" r="18" fill="#22c55e"/>
  <path d="M296 275 L303 282 L315 268" fill="none" stroke="#052e16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="850" y="235" width="270" height="190" rx="24" fill="#450a0a" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
  <text x="985" y="285" text-anchor="middle" fill="#fca5a5" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Kallis reitti</text>
  <text x="985" y="325" text-anchor="middle" fill="#fff1f2" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Azure</text>
  <text x="985" y="368" text-anchor="middle" fill="#fecdd3" font-family="Arial, Helvetica, sans-serif" font-size="28">1,00 $ / Mtok input</text>
  <text x="985" y="405" text-anchor="middle" fill="#fecdd3" font-family="Arial, Helvetica, sans-serif" font-size="28">6,00 $ / Mtok output</text>
  <circle cx="1075" cy="275" r="18" fill="#ef4444"/>
  <text x="1075" y="282" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">€</text>

  <path d="M455 345 C410 345, 390 330, 350 330" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <path d="M745 345 C800 345, 820 330, 850 330" fill="none" stroke="#ef4444" stroke-width="16" stroke-linecap="round" marker-end="url(#arrowRed)"/>

  <rect x="120" y="490" width="960" height="110" rx="20" fill="#0f172a" opacity="0.82"/>
  <text x="600" y="538" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Sama malli voi maksaa eri verran riippuen siitä, mille providerille reititin ohjaa pyynnön.</text>
  <text x="600" y="578" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Jos sallittuja providereita ei rajata, hinta voi nousta huomaamatta kesken session.</text>
</svg>